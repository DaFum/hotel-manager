<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d0f" />
    <title>Hotel Manager</title>
    <!--
      The interface type: Anton as the poster grotesque of the masthead and the
      panel headings, IBM Plex Sans for reading, IBM Plex Mono for every figure.
      Latin Extended is requested because German is a seeded locale. The faces
      are progressive enhancement: tokens.css carries a condensed and a
      monospaced fallback stack, so an offline or blocked load costs character,
      never legibility.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
